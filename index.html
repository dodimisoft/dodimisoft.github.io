<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoDiMi</title>
<link rel="icon" href="castlego/img/icon.webp">
<style>
:root{--bg:#0a1017;--surface:#152131;--border:#233448;--accent:#4fd1e0;--text:#f4f9fc;--dim:#afc8de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
header img{width:44px;height:44px;border-radius:10px}
header .t{font-weight:700;font-size:20px}
header nav{margin-left:auto;font-size:14px}
h1{font-size:28px;line-height:1.25;margin:8px 0 16px}
h2{font-size:18px;margin:28px 0 8px;color:var(--accent)}
p{margin:0 0 12px;color:var(--dim)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:20px 0}
.grid img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stats div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.stats b{display:block;font-size:22px;color:var(--text)}
.stats span{font-size:13px;color:var(--dim)}
.links a{display:inline-block;margin:0 14px 8px 0}
footer{margin-top:40px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<header><img src="castlego/img/icon.webp" alt=""><span class="t">DoDiMi</span></header>

<h1>DoDiMi</h1>
<p>Mobile games.</p>
<a class="card" href="castlego/" style="display:flex;gap:16px;align-items:center;text-decoration:none">
<img src="castlego/img/icon.webp" alt="" style="width:72px;height:72px;border-radius:16px">
<span><b style="color:var(--text);font-size:18px">Castle Go</b><br><span style="color:var(--dim)">Tower defense · 500 levels</span></span>
</a>
<footer>© DoDiMi · <a href="mailto:dodimisoft@gmail.com">dodimisoft@gmail.com</a></footer>
</div>
</body>
</html>
